<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Quiz Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('main.index') }}" class="brand">Online Quiz Platform</a>
        <a href="{{ url_for('main.new_quiz') }}" class="new-quiz-link">+ New Quiz</a>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
